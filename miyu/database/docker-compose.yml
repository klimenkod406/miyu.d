version: '3.8'

services:
  # SQLite-файл шарим как именованный том. На проде заменим на Postgres.
  # SQLite не нуждается в отдельном сервисе — оставляем оригинальный для удобства просмотра.
  db:
    image: nouchka/sqlite:latest
    container_name: miyu-sqlite
    volumes:
      - ./miyu.db:/data/miyu.db
    ports:
      - "8080:8080"
    environment:
      SQLITE_DATABASE: miyu

  # Redis: кеш + RQ-очередь для ai-service.
  redis:
    image: redis:7-alpine
    container_name: miyu-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO для файлов (опционально).
  minio:
    image: minio/minio
    container_name: miyu-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: miyu
      MINIO_ROOT_PASSWORD: miyu123
    volumes:
      - ./minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # FastAPI ai-service: HTTP API для анализа треков.
  ai-service:
    build:
      context: ../ai-service
    container_name: miyu-ai-service
    depends_on:
      redis:
        condition: service_healthy
    environment:
      MIYU_AI_REDIS_URL: redis://redis:6379/0
      MIYU_AI_DB_PATH: /data/miyu.db
      MIYU_AI_STORAGE_ROOT: /data/uploads
      MIYU_AI_LOG_LEVEL: INFO
    volumes:
      - ./miyu.db:/data/miyu.db
      - ../uploads:/data/uploads
      # Кэш HuggingFace/torch hub — переживает рестарт контейнера.
      - ai_models_cache:/root/.cache
    ports:
      - "8001:8001"

  # RQ-воркер: тот же образ, отдельная команда. Можно масштабировать `--scale ai-worker=N`.
  ai-worker:
    build:
      context: ../ai-service
    container_name: miyu-ai-worker
    command: ["python", "worker.py"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      MIYU_AI_REDIS_URL: redis://redis:6379/0
      MIYU_AI_DB_PATH: /data/miyu.db
      MIYU_AI_STORAGE_ROOT: /data/uploads
      MIYU_AI_LOG_LEVEL: INFO
      PYTHONPATH: /app
    volumes:
      - ./miyu.db:/data/miyu.db
      - ../uploads:/data/uploads
      - ai_models_cache:/root/.cache

  # Prometheus: сбор метрик (Phase 5).
  prometheus:
    image: prom/prometheus:latest
    container_name: miyu-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ../ai-service/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - ai-service

  # Grafana: визуализация метрик (Phase 5).
  grafana:
    image: grafana/grafana:latest
    container_name: miyu-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ../ai-service/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/miyu.json
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  ai_models_cache:
  prometheus_data:
  grafana_data:
