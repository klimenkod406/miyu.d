# Generate self-signed cert (run once on VPS):
# mkdir -p /etc/nginx/ssl && openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout /etc/nginx/ssl/nginx.key -out /etc/nginx/ssl/nginx.crt \
#   -subj "/CN=161.104.19.164"

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}


server {
  listen 443 ssl http2;
  server_name _;

  client_max_body_size 200M;
  ssl_certificate /etc/nginx/ssl/nginx.crt;
  ssl_certificate_key /etc/nginx/ssl/nginx.key;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 256;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location /api/ {
    set $backend_upstream http://backend:3001;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/avatars/ {
    alias /var/www/uploads/avatars/;
    access_log off;
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
  }

  location /uploads/ {
    alias /var/www/uploads/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public";
  }

  location /ai/ {
    set $ai_upstream http://ai-service:8001;
    proxy_pass $ai_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $frontend_upstream http://frontend:80;
    proxy_pass $frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
